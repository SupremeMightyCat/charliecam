name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install opencv-python-headless numpy pillow fastapi uvicorn pytest httpx ruff
      - run: pip install -e . --no-deps
      - run: python -m charliecam download-models
      - run: ruff check src tests
      - run: pytest -v
