[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "charliecam"
version = "0.1.0"
description = "Real-time facial recognition camera: flags known and unknown faces"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "opencv-python>=4.8", "numpy>=1.24", "pillow>=10.1",
    "fastapi>=0.110", "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=7", "httpx>=0.27", "ruff>=0.4"]

[project.scripts]
charliecam = "charliecam.cli:main"

[project.gui-scripts]
charliecam-gui = "charliecam.gui.app:main"
charliecam-web = "charliecam.web.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"charliecam.web" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]

[tool.ruff]
line-length = 110
target-version = "py39"

[tool.ruff.lint]
select = ["E", "W", "F", "B", "I"]

[tool.ruff.lint.isort]
known-first-party = ["charliecam", "conftest"]
