[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "flockcam"
version = "0.1.0"
description = "Real-time facial recognition camera: flags known and unknown faces"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["opencv-python>=4.8", "numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
flockcam = "flockcam.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
